description: >-
  SuperMe is a professional network for the AI age that connects people with expert
  knowledge from real professionals instead of generic answers. It offers Work Groups
  (curated panels of founders and executives with AI profiles trained on their actual
  work), My Agent (a personal AI assistant that finds relevant experts and synthesizes
  their perspectives), and Group Chat (real-time discussions across multiple AI profiles
  on a topic). SuperMe publishes an official, OAuth-protected hosted MCP server so its
  network can be used directly from Claude, ChatGPT, and Cursor, with incognito mode and
  per-item sharing controls (public, private, team-only, or auto-indexed). Backed by
  Forerunner Ventures and Greylock.
